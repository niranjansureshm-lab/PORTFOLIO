function generateContributionGrid() {
  const weeks = 26, days = 7, grid = [];
  for (let w = 0; w < weeks; w++) {
    const week = [];
    for (let d = 0; d < days; d++) {
      const seed = (w * 7 + d) * 9301 + 49297;
      const rand = (seed % 233280) / 233280;
      let level = 0;
      if (rand > 0.85) level = 4; else if (rand > 0.65) level = 3;
      else if (rand > 0.45) level = 2; else if (rand > 0.25) level = 1;
      week.push(level);
    }
    grid.push(week);
  }
  return grid;
}

function Preloader({ onDone }) {
  const [pct, setPct] = useState(0);
  useEffect(() => {
    const int = setInterval(() => {
      setPct((p) => {
        const next = Math.min(100, p + 3 + Math.random() * 6);
        if (next >= 100) { clearInterval(int); setTimeout(() => onDone(), 400); }
        return next;
      });
    }, 60);
    return () => clearInterval(int);
  }, [onDone]);
  return (
    <div className="preloader">
      <div className="preloader-logo">{portfolio.personal.shortName}</div>
      <div className="preloader-bar"><div style={{ width: `${pct}%` }} /></div>
      <div className="preloader-pct">{Math.round(pct)}%</div>
    </div>
  );
}

function CustomCursor() {
  const dotRef = useRef(null); const ringRef = useRef(null);
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isTouch = window.matchMedia('(hover: none)').matches;
    if (reduced || isTouch) return;
    const dot = dotRef.current, ring = ringRef.current;
    if (!dot || !ring) return;
    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let rx = mx, ry = my, rafId;
    const onMove = (e) => { mx = e.clientX; my = e.clientY; dot.style.left = mx + 'px'; dot.style.top = my + 'px'; };
    const onOver = (e) => {
      const hoverable = e.target.closest('a, button, input, textarea, [role="button"], .group');
      ring.classList.toggle('hover', !!hoverable);
    };
    const tick = () => { rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; rafId = requestAnimationFrame(tick); };
    window.addEventListener('mousemove', onMove, { passive: true });
    window.addEventListener('mouseover', onOver, { passive: true });
    tick();
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseover', onOver); cancelAnimationFrame(rafId); };
  }, []);
  return (<><div ref={dotRef} className="custom-cursor" /><div ref={ringRef} className="custom-cursor-ring" /></>);
}

function ScrollProgress() {
  const [w, setW] = useState(0);
  useEffect(() => {
    let ticking = false;
    const onScroll = () => {
      if (ticking) return; ticking = true;
      requestAnimationFrame(() => {
        const h = document.documentElement.scrollHeight - window.innerHeight;
        setW(h > 0 ? (window.scrollY / h) * 100 : 0);
        ticking = false;
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div className="scroll-progress" style={{ width: `${w}%` }} />;
}

const ToastContext = React.createContext({ push: () => {} });
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, icon) => {
    const id = Date.now() + Math.random();
    setToasts((t) => [...t, { id, msg, icon }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 2600);
  }, []);
  return (
    <ToastContext.Provider value={{ push }}>
      {children}
      {toasts.map((t) => (
        <MDiv key={t.id} initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 20 }} className="toast">
          {t.icon && <Icon name={t.icon} size={14} />}{t.msg}
        </MDiv>
      ))}
    </ToastContext.Provider>
  );
}

const AchievementsContext = React.createContext({ unlock: () => {}, unlocked: [] });
function AchievementsProvider({ children }) {
  const [unlocked, setUnlocked] = useState([]);
  const [current, setCurrent] = useState(null);
  const unlock = useCallback((key, title, description) => {
    setUnlocked((prev) => {
      if (prev.includes(key)) return prev;
      setCurrent({ key, title, description });
      setTimeout(() => setCurrent(null), 4000);
      return [...prev, key];
    });
  }, []);
  return (
    <AchievementsContext.Provider value={{ unlock, unlocked }}>
      {children}
      <AnimatePresenceC>
        {current && (
          <MDiv initial={{ opacity: 0, x: 50 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: 50 }} className="achievement">
            <div className="w-9 h-9 rounded-xl accent-bg flex items-center justify-center shrink-0">
              <H.Trophy size={16} className="text-white" />
            </div>
            <div>
              <div className="text-xs font-semibold gradient-text">🏆 {current.title}</div>
              <div className="text-[10px] text-white/60 mt-0.5">{current.description}</div>
            </div>
          </MDiv>
        )}
      </AnimatePresenceC>
    </AchievementsContext.Provider>
  );
}

function RippleEffect() {
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;
    const handler = (e) => {
      const el = document.createElement('div');
      el.className = 'ripple-el';
      el.style.left = e.clientX + 'px'; el.style.top = e.clientY + 'px';
      el.style.width = '20px'; el.style.height = '20px';
      el.style.transform = 'translate(-50%, -50%)';
      document.body.appendChild(el);
      requestAnimationFrame(() => { el.style.animation = 'ripple 0.7s ease-out forwards'; });
      setTimeout(() => el.remove(), 800);
    };
    window.addEventListener('click', handler);
    return () => window.removeEventListener('click', handler);
  }, []);
  return null;
}

function CommandPalette({ open, onClose }) {
  const [query, setQuery] = useState('');
  const [activeIdx, setActiveIdx] = useState(0);
  const inputRef = useRef(null);
  const { push } = React.useContext(ToastContext);

  const commands = useMemo(() => [
    ...portfolio.nav.map((n) => ({ id: 'nav-' + n.id, icon: 'Compass', label: n.label, action: () => { const el = document.querySelector(n.href); if (el) el.scrollIntoView({ behavior: 'smooth' }); } })),
    { id: 'gh', icon: 'Github', label: 'Open GitHub', action: () => window.open(portfolio.socials.github, '_blank') },
    { id: 'li', icon: 'LinkedIn', label: 'Open LinkedIn', action: () => window.open(portfolio.socials.linkedin, '_blank') },
    { id: 'ig', icon: 'Instagram', label: 'Open Instagram', action: () => window.open(portfolio.socials.instagram, '_blank') },
    { id: 'mail', icon: 'Mail', label: 'Copy email', action: () => { navigator.clipboard?.writeText(portfolio.socials.email); push('Email copied!', 'Check'); } },
    { id: 'top', icon: 'ArrowUp', label: 'Scroll to top', action: () => window.scrollTo({ top: 0, behavior: 'smooth' }) },
    { id: 'accent', icon: 'Palette', label: 'Cycle accent color', action: () => {
      const accents = ['purple', 'blue', 'cyan', 'pink'];
      const cur = document.documentElement.getAttribute('data-accent') || 'purple';
      const next = accents[(accents.indexOf(cur) + 1) % accents.length];
      document.documentElement.setAttribute('data-accent', next);
      push(`Accent: ${next}`, 'Palette');
    }},
    { id: 'share', icon: 'Share2', label: 'Share portfolio', action: () => {
      if (navigator.share) navigator.share({ title: 'Niranjan Suresh — Portfolio', url: window.location.href });
      else { navigator.clipboard?.writeText(window.location.href); push('Link copied!', 'Link'); }
    }},
  ], [push]);

  const filtered = useMemo(() => {
    if (!query.trim()) return commands;
    const q = query.toLowerCase();
    return commands.filter((c) => c.label.toLowerCase().includes(q));
  }, [commands, query]);

  useEffect(() => { if (open && inputRef.current) { inputRef.current.focus(); setQuery(''); setActiveIdx(0); } }, [open]);

  useEffect(() => {
    if (!open) return;
    const onKey = (e) => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowDown') { e.preventDefault(); setActiveIdx((i) => Math.min(filtered.length - 1, i + 1)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setActiveIdx((i) => Math.max(0, i - 1)); }
      else if (e.key === 'Enter') { e.preventDefault(); const cmd = filtered[activeIdx]; if (cmd) { cmd.action(); onClose(); } }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, filtered, activeIdx, onClose]);

  return (
    <AnimatePresenceC>
      {open && (
        <MDiv initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="cmd-overlay" onClick={onClose}>
          <MDiv initial={{ y: -20, scale: 0.96 }} animate={{ y: 0, scale: 1 }} exit={{ y: -20, scale: 0.96 }} transition={{ duration: 0.15 }} className="cmd-box" onClick={(e) => e.stopPropagation()}>
            <input ref={inputRef} className="cmd-input" placeholder="Type a command or search..." value={query} onChange={(e) => { setQuery(e.target.value); setActiveIdx(0); }} />
            <div className="cmd-list">
              {filtered.length === 0 && <div className="px-4 py-6 text-center text-sm text-white/40">No results</div>}
              {filtered.map((cmd, i) => (
                <div key={cmd.id} className={`cmd-item ${i === activeIdx ? 'active' : ''}`} onClick={() => { cmd.action(); onClose(); }} onMouseEnter={() => setActiveIdx(i)}>
                  <Icon name={cmd.icon} size={16} className="text-[color:var(--accent-1)]" />
                  <span className="text-sm">{cmd.label}</span>
                </div>
              ))}
            </div>
          </MDiv>
        </MDiv>
      )}
    </AnimatePresenceC>
  );
}

function MagneticButton({ children, className = '', strength = 0.35, ...rest }) {
  const ref = useRef(null);
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isTouch = window.matchMedia('(hover: none)').matches;
    if (reduced || isTouch) return;
    const el = ref.current; if (!el) return;
    const onMove = (e) => {
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dx = (e.clientX - cx) * strength, dy = (e.clientY - cy) * strength;
      el.style.transform = `translate(${dx}px, ${dy}px)`;
    };
    const onLeave = () => { el.style.transform = 'translate(0, 0)'; };
    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseleave', onLeave);
    return () => { el.removeEventListener('mousemove', onMove); el.removeEventListener('mouseleave', onLeave); };
  }, [strength]);
  return <button ref={ref} className={`magnetic ${className}`} {...rest}>{children}</button>;
}

function TiltCard({ children, className = '', max = 8, ...rest }) {
  const ref = useRef(null);
  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isTouch = window.matchMedia('(hover: none)').matches;
    if (reduced || isTouch) return;
    const el = ref.current; if (!el) return;
    const onMove = (e) => {
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      el.style.transform = `perspective(900px) rotateX(${-(y - 0.5) * max * 2}deg) rotateY(${(x - 0.5) * max * 2}deg)`;
    };
    const onLeave = () => { el.style.transform = ''; };
    el.addEventListener('mousemove', onMove);
    el.addEventListener('mouseleave', onLeave);
    return () => { el.removeEventListener('mousemove', onMove); el.removeEventListener('mouseleave', onLeave); };
  }, [max]);
  return <div ref={ref} className={`tilt-card ${className}`} {...rest}>{children}</div>;
}

function AnimatedBackground() {
  const orbsRef = useRef(null), particlesRef = useRef(null), gridRef = useRef(null), particlesLayerRef = useRef(null);

  useEffect(() => {
    const layer = particlesLayerRef.current; if (!layer) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isMobile = window.matchMedia('(max-width: 768px)').matches;
    const count = reduced ? 0 : isMobile ? 16 : 34;
    layer.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const p = document.createElement('span');
      p.className = 'ab-particle';
      const size = 1 + Math.random() * 2.5;
      p.style.width = size + 'px'; p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%'; p.style.top = Math.random() * 100 + '%';
      p.style.setProperty('--dur', (14 + Math.random() * 18) + 's');
      p.style.setProperty('--delay', (-Math.random() * 20) + 's');
      p.style.setProperty('--dx', ((Math.random() - 0.5) * 60) + 'px');
      p.style.setProperty('--dy', (-30 - Math.random() * 50) + 'px');
      p.style.setProperty('--peak', 0.25 + Math.random() * 0.5);
      layer.appendChild(p);
    }
    return () => { if (layer) layer.innerHTML = ''; };
  }, []);

  useEffect(() => {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isTouch = window.matchMedia('(hover: none)').matches;
    if (reduced) return;
    const orbs = orbsRef.current, particles = particlesRef.current, grid = gridRef.current;
    if (!orbs || !particles || !grid) return;
    let targetX = 0, targetY = 0, currentX = 0, currentY = 0, scrollY = 0, rafId = null;
    const render = () => {
      currentX += (targetX - currentX) * 0.06; currentY += (targetY - currentY) * 0.06;
      orbs.style.transform = `translate3d(${currentX * 14}px, ${currentY * 14 + scrollY * -0.06}px, 0)`;
      particles.style.transform = `translate3d(${currentX * 8}px, ${currentY * 8 + scrollY * -0.10}px, 0)`;
      grid.style.transform = `translate3d(${currentX * 4}px, ${currentY * 4 + scrollY * -0.03}px, 0)`;
      if (Math.abs(targetX - currentX) > 0.001 || Math.abs(targetY - currentY) > 0.001) rafId = requestAnimationFrame(render);
      else rafId = null;
    };
    const kick = () => { if (!rafId) rafId = requestAnimationFrame(render); };
    const onMouse = (e) => { targetX = (e.clientX / window.innerWidth) * 2 - 1; targetY = (e.clientY / window.innerHeight) * 2 - 1; kick(); };
    const onScroll = () => { scrollY = window.scrollY || 0; kick(); };
    if (!isTouch) window.addEventListener('mousemove', onMouse, { passive: true });
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => {
      if (!isTouch) window.removeEventListener('mousemove', onMouse);
      window.removeEventListener('scroll', onScroll);
      if (rafId) cancelAnimationFrame(rafId);
    };
  }, []);

  return (
    <div className="ab-root" aria-hidden="true">
      <div className="ab-base" />
      <div className="ab-orbs-layer" ref={orbsRef}>
        <div className="ab-orb ab-orb-1" /><div className="ab-orb ab-orb-2" />

      <div className="ab-grid" ref={gridRef} />
      <div className="ab-noise" /><div className="ab-vignette" />
    </div>
  );
}

function Typewriter({ words, speed = 70, pause = 1400 }) {
  const [text, setText] = useState(''); const [idx, setIdx] = useState(0); const [del, setDel] = useState(false);
  useEffect(() => {
    const current = words[idx % words.length];
    let t;
    if (!del && text === current) t = setTimeout(() => setDel(true), pause);
    else if (del && text === '') { setDel(false); setIdx((i) => i + 1); }
    else t = setTimeout(() => { setText(del ? current.slice(0, text.length - 1) : current.slice(0, text.length + 1)); }, del ? speed / 2 : speed);
    return () => clearTimeout(t);
  }, [text, del, idx, words, speed, pause]);
  return <span className="gradient-text">{text}<span className="typewriter-cursor" /></span>;
}

function Counter({ to, suffix = '', duration = 1400 }) {
  const [n, setN] = useState(0); const ref = useRef(null); const started = useRef(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting && !started.current) {
          started.current = true;
          const start = performance.now();
          const tick = (now) => {
            const p = Math.min(1, (now - start) / duration);
            setN(Math.round(to * (1 - Math.pow(1 - p, 3))));
            if (p < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.4 });
    io.observe(el);
    return () => io.disconnect();
  }, [to, duration]);
  return <span ref={ref}>{n}{suffix}</span>;
}

function SnakeGame({ onClose }) {
  const SIZE = 15;
  const [snake, setSnake] = useState([{ x: 7, y: 7 }]);
  const [food, setFood] = useState({ x: 10, y: 7 });
  const [dir, setDir] = useState({ x: 1, y: 0 });
  const [alive, setAlive] = useState(true);
  const [score, setScore] = useState(0);
  const { push } = React.useContext(ToastContext);
  const { unlock } = React.useContext(AchievementsContext);

  useEffect(() => {
    const onKey = (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)) {
        e.preventDefault();
        const k = e.key;
        setDir((d) => {
          if ((k === 'ArrowUp' || k === 'w') && d.y === 0) return { x: 0, y: -1 };
          if ((k === 'ArrowDown' || k === 's') && d.y === 0) return { x: 0, y: 1 };
          if ((k === 'ArrowLeft' || k === 'a') && d.x === 0) return { x: -1, y: 0 };
          if ((k === 'ArrowRight' || k === 'd') && d.x === 0) return { x: 1, y: 0 };
          return d;
        });
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  useEffect(() => {
    if (!alive) return;
    const int = setInterval(() => {
      setSnake((s) => {
        const head = { x: s[0].x + dir.x, y: s[0].y + dir.y };
        if (head.x < 0 || head.x >= SIZE || head.y < 0 || head.y >= SIZE) { setAlive(false); return s; }
        if (s.some((seg) => seg.x === head.x && seg.y === head.y)) { setAlive(false); return s; }
        const newSnake = [head, ...s];
        if (head.x === food.x && head.y === food.y) {
          setScore((sc) => sc + 1);
          setFood({ x: Math.floor(Math.random() * SIZE), y: Math.floor(Math.random() * SIZE) });
        } else newSnake.pop();
        return newSnake;
      });
    }, 130);
    return () => clearInterval(int);
  }, [dir, food, alive]);

  useEffect(() => {
    if (!alive && score >= 3) { push(`Score: ${score}`, 'Trophy'); unlock('snake', 'Snake Master', `You scored ${score} points!`); }
  }, [alive, score, push, unlock]);

  const cells = [];
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const isSnake = snake.some((s) => s.x === x && s.y === y);
      const isHead = snake[0].x === x && snake[0].y === y;
      const isFood = food.x === x && food.y === y;
      let cls = 'snake-cell';
      if (isFood) cls += ' food';
      else if (isSnake) cls += ' snake';
      cells.push(<div key={`${x}-${y}`} className={cls} style={isHead ? { background: 'var(--accent-3)' } : {}} />);
    }
  }

  return (
    <MDiv initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="cmd-overlay" onClick={onClose}>
      <MDiv initial={{ scale: 0.9 }} animate={{ scale: 1 }} exit={{ scale: 0.9 }} onClick={(e) => e.stopPropagation()} className="cmd-box" style={{ maxWidth: 440, padding: 24 }}>
        <div className="flex items-center justify-between mb-4">
          <div>
            <div className="text-sm font-semibold gradient-text">🐍 Snake Easter Egg</div>
            <div className="text-[10px] text-white/40 mt-0.5">Arrow keys or WASD</div>
          </div>
          <button onClick={onClose} className="text-white/60 hover:text-white"><H.X size={16} /></button>
        </div>
        <div className="snake-grid" style={{ gridTemplateColumns: `repeat(${SIZE}, 1fr)` }}>{cells}</div>
        <div className="mt-4 flex items-center justify-between text-xs text-white/60">
          <span>Score: <span className="gradient-text font-bold">{score}</span></span>
          {!alive && (
            <button onClick={() => { setSnake([{ x: 7, y: 7 }]); setFood({ x: 10, y: 7 }); setDir({ x: 1, y: 0 }); setAlive(true); setScore(0); }} className="px-3 py-1 rounded-full accent-bg text-white text-xs">
              Play again
            </button>
          )}
        </div>
      </MDiv>
    </MDiv>
  );
}

function ProjectModal({ project, onClose }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [onClose]);
  const d = project.detail || {};
  return (
    <MDiv initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
      className="fixed inset-0 z-[100] flex items-start sm:items-center justify-center p-3 sm:p-6 bg-black/80 backdrop-blur-md" onClick={onClose}>
      <MDiv initial={{ opacity: 0, y: 40, scale: 0.96 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, y: 20, scale: 0.97 }} transition={{ duration: 0.35 }} onClick={(e) => e.stopPropagation()}

        <button onClick={onClose} className="absolute right-4 top-4 flex h-9 w-9 items-center justify-center rounded-full border border-white/[0.1] bg-white/[0.03] text-white/70 hover:text-white">
          <H.X size={16} />
        </button>
        <div className="flex items-center gap-3">
          <div className="flex h-12 w-12 items-center justify-center rounded-2xl accent-bg text-white">
            <Icon name={project.icon} size={22} />
          </div>
          <div>
            <div className="text-[11px] tracking-[0.2em] text-[color:var(--accent-1)] uppercase">{project.category}</div>
            <h3 className="text-2xl sm:text-3xl font-bold">{project.name}</h3>
          </div>
        </div>
        <div className="mt-6 space-y-6 text-sm">
          {d.problem && (<div><div className="text-[11px] tracking-[0.2em] text-white/40 uppercase mb-2">Problem</div><p className="text-white/70 leading-relaxed">{d.problem}</p></div>)}
          {d.solution && (<div><div className="text-[11px] tracking-[0.2em] text-white/40 uppercase mb-2">Solution</div><p className="text-white/70 leading-relaxed">{d.solution}</p></div>)}
          {d.features && (<div><div className="text-[11px] tracking-[0.2em] text-white/40 uppercase mb-2">Features</div>
            <ul className="space-y-1.5">{d.features.map((f, i) => (<li key={i} className="flex items-start gap-2 text-white/70"><span className="mt-1.5 h-1.5 w-1.5 rounded-full bg-[color:var(--accent-1)] shrink-0" /><span>{f}</span></li>))}</ul>
          </div>)}
          <div>
            <div className="text-[11px] tracking-[0.2em] text-white/40 uppercase mb-2">Technology</div>
            <div className="flex flex-wrap gap-2">{project.tech.map((t, i) => {
              const TI = getTechIcon(t);
              return (<span key={i} className="inline-flex items-center gap-1.5 rounded-full border border-white/[0.08] bg-white/[0.03] px-3 py-1 text-[11px] text-white/70">{TI ? <TI size={12} /> : <span className="h-1.5 w-1.5 rounded-full bg-[color:var(--accent-1)]" />}{t}</span>);

function Contact() {
  const [form, setForm] = useState({ name: '', email: '', message: '' });
  const [errors, setErrors] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const { push } = React.useContext(ToastContext);
  const { unlock } = React.useContext(AchievementsContext);

  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name = 'Please enter your name.';
    if (!form.email.trim()) e.email = 'Please enter your email.';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = 'Please enter a valid email.';
    if (!form.message.trim()) e.message = 'Please enter a message.';
    else if (form.message.trim().length < 10) e.message = 'Message should be at least 10 characters.';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const fireConfetti = () => {
    const colors = ['#a78bfa', '#60a5fa', '#8b5cf6', '#22d3ee', '#f0abfc', '#ffffff'];
    for (let i = 0; i < 60; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
      el.style.animationDelay = (Math.random() * 0.4) + 's';
      el.style.borderRadius = Math.random() > 0.5 ? '2px' : '50%';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3600);
    }
  };

  const [sending, setSending] = useState(false);
  const onSubmit = async (ev) => {
    ev.preventDefault();
    if (!validate() || sending) return;
    setSending(true);
    try {
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(form),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { push(data.error || 'Could not send message', 'X'); return; }
      setSubmitted(true);
      fireConfetti();
      push('Message sent!', 'Check');
      unlock('contact', 'Reached Out', 'You sent a message!');
    } catch (e) {
      push('Server not reachable. Try again.', 'X');
    } finally {
      setSending(false);
    }
  };

  const onChange = (k) => (ev) => setForm({ ...form, [k]: ev.target.value });

  return (
    <section id="contact" className="relative mx-auto max-w-5xl px-5 sm:px-8 py-24 sm:py-32 scroll-mt-24">
      <div className="text-center">
        <MDiv initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.6 }}>
          <h2 className="text-3xl sm:text-4xl lg:text-[56px] font-bold tracking-tight leading-[1.1] whitespace-pre-line">{portfolio.contact.heading}</h2>
          <p className="mt-5 mx-auto max-w-2xl text-white/55 text-base sm:text-lg">{portfolio.contact.subtitle}</p>
        </MDiv>
      </div>

      <div className="mt-10 grid grid-cols-1 sm:grid-cols-3 gap-3">
        {portfolio.contact.infoItems.map((item, i) => (
          <MDiv key={i} initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.5, delay: i * 0.05 }}
            className="rounded-2xl glass p-4 flex items-center gap-3">
            <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-white/[0.08] text-[color:var(--accent-1)]"
              style={{ background: 'linear-gradient(135deg, color-mix(in srgb, var(--accent-2) 20%, transparent), color-mix(in srgb, var(--accent-4) 20%, transparent))' }}>
              <Icon name={item.icon} size={16} />
            </div>
            <div className="min-w-0">
              <div className="text-[10px] tracking-[0.2em] text-white/40 uppercase">{item.label}</div>
              <div className="text-xs text-white/80 truncate">{item.value}</div>
            </div>
          </MDiv>
        ))}
      </div>

      <MDiv initial={{ opacity: 0, y: 30 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.6, delay: 0.1 }} className="mt-6 rounded-3xl glass p-6 sm:p-8">
        {submitted ? (
          <div className="flex flex-col items-center justify-center py-10 text-center">
            <div className="flex h-16 w-16 items-center justify-center rounded-full accent-bg"><H.Check size={28} className="text-white" /></div>

function Chatbot() {
  const [open, setOpen] = useState(false);
  const [msgs, setMsgs] = useState([{ from: 'bot', text: portfolio.chatbot.default }]);
  const [input, setInput] = useState('');
  const [listening, setListening] = useState(false);
  const endRef = useRef(null);
  const { unlock } = React.useContext(AchievementsContext);
  const { push } = React.useContext(ToastContext);

  useEffect(() => { if (endRef.current) endRef.current.scrollIntoView({ behavior: 'smooth' }); }, [msgs, open]);

  const respond = (text) => {
    const low = text.toLowerCase();
    const hit = portfolio.chatbot.qa.find((x) => low.includes(x.q));
    return hit ? hit.a : portfolio.chatbot.default;
  };

  const send = (text) => {
    if (!text.trim()) return;
    setMsgs((m) => [...m, { from: 'user', text }]);
    setInput('');
    setTimeout(() => { setMsgs((m) => [...m, { from: 'bot', text: respond(text) }]); }, 500);
  };

  const startVoice = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { push('Voice not supported', 'X'); return; }
    try {
      const rec = new SR();
      rec.lang = 'en-IN';
      rec.onstart = () => setListening(true);
      rec.onend = () => setListening(false);
      rec.onresult = (e) => { const t = e.results[0][0].transcript; setInput(t); send(t); unlock('voice', 'Voice Explorer', 'You used voice search!'); };
      rec.start();
    } catch (e) { setListening(false); }
  };

  const quick = ['Skills', 'Projects', 'Experience', 'Contact'];
  return (
    <>
      <AnimatePresenceC>
        {open && (
          <MDiv initial={{ opacity: 0, y: 20, scale: 0.96 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, y: 20, scale: 0.96 }}
            className="fixed right-5 bottom-40 z-40 w-[320px] max-w-[calc(100vw-40px)] rounded-3xl glass-strong overflow-hidden shadow-[0_20px_60px_rgba(0,0,0,0.7)] flex flex-col"
            style={{ height: '440px' }}>
            <div className="flex items-center gap-3 px-4 py-3 border-b border-white/[0.08]">
              <div className="h-9 w-9 rounded-full accent-bg flex items-center justify-center"><H.Bot size={16} className="text-white" /></div>
              <div className="flex-1"><div className="text-sm font-semibold">Portfolio Assistant</div><div className="text-[10px] text-emerald-400 flex items-center gap-1"><span className="h-1.5 w-1.5 rounded-full bg-emerald-400" /> Online</div></div>
              <button onClick={() => setOpen(false)} className="text-white/50 hover:text-white"><H.X size={16} /></button>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {msgs.map((m, i) => (
                <div key={i} className={`flex ${m.from === 'user' ? 'justify-end' : 'justify-start'}`}>
                  <div className={`chat-bubble ${m.from === 'user' ? 'chat-user' : 'chat-bot'}`}>{m.text}</div>
                </div>
              ))}
              <div ref={endRef} />
            </div>
            <div className="px-3 pb-2 flex gap-1.5 flex-wrap">
              {quick.map((q) => (
                <button key={q} onClick={() => send(q)} className="text-[10px] rounded-full border border-white/[0.1] bg-white/[0.03] px-2.5 py-1 text-white/60 hover:text-white hover:border-[color:var(--accent-1)]">{q}</button>
              ))}
            </div>
            <div className="p-3 border-t border-white/[0.08] flex gap-2">
              <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') send(input); }} placeholder="Ask something..."
                className="flex-1 rounded-xl border border-white/[0.08] bg-white/[0.02] px-3 py-2 text-xs text-white placeholder-white/30 outline-none focus:border-[color:var(--accent-1)]" />
              <button onClick={startVoice} className={`h-9 w-9 rounded-xl border flex items-center justify-center transition-all ${listening ? 'accent-bg border-transparent text-white animate-pulse' : 'border-white/[0.08] bg-white/[0.03] text-white/60 hover:text-white'}`}>
                <H.Mic size={14} />
              </button>
              <button onClick={() => send(input)} className="h-9 w-9 rounded-xl accent-bg text-white flex items-center justify-center"><H.Send size={14} /></button>
            </div>
          </MDiv>
        )}
      </AnimatePresenceC>
      <button onClick={() => setOpen((v) => !v)}
        className="fixed right-5 bottom-40 z-40 flex h-14 w-14 items-center justify-center rounded-2xl text-white hover:scale-110 transition-all shadow-[0_10px_30px_rgba(0,0,0,0.6)] border border-[color:var(--accent-1)]/30"
        style={{ background: 'linear-gradient(135deg, var(--accent-2), var(--accent-4))' }}
        aria-label="Open chat">
        {open ? <H.X size={22} /> : <H.MessageCircle size={22} />}
        {!open && <span className="absolute -top-1 -right-1 h-3.5 w-3.5 rounded-full bg-emerald-400 border-2 border-black animate-pulse" />}
      </button>
    </>
  );
}

function BackToTop() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const onScroll = () => setShow(window.scrollY > 600);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <AnimatePresenceC>
      {show && (
        <MDiv initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 20 }} className="fixed right-5 bottom-5 z-40">
          <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="flex h-11 w-11 items-center justify-center rounded-xl accent-bg text-white" aria-label="Back to top">
            <H.ArrowUp size={18} />
          </button>
        </MDiv>
      )}
    </AnimatePresenceC>
  );
}

function MusicToggle() {
  const ctxRef = useRef(null); const oscRef = useRef(null); const gainRef = useRef(null);
  const [on, setOn] = useState(false);
  const { push } = React.useContext(ToastContext);
  const toggle = () => {
    try {
      if (!on) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) { push('Audio not supported', 'X'); return; }
        const ctx = new Ctx();
        const osc1 = ctx.createOscillator(); const osc2 = ctx.createOscillator(); const gain = ctx.createGain();
        osc1.type = 'sine'; osc1.frequency.value = 110;
        osc2.type = 'sine'; osc2.frequency.value = 164.81;
        gain.gain.value = 0;
        osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
        osc1.start(); osc2.start();
        gain.gain.linearRampToValueAtTime(0.02, ctx.currentTime + 1.5);
        ctxRef.current = ctx; oscRef.current = [osc1, osc2]; gainRef.current = gain;
        setOn(true); push('Ambient sound on', 'Music');
      } else {
        gainRef.current?.gain.linearRampToValueAtTime(0, ctxRef.current.currentTime + 0.6);
        setTimeout(() => { oscRef.current?.forEach((o) => { try { o.stop(); } catch(e){} }); ctxRef.current?.close(); setOn(false); }, 700);
        push('Sound off', 'VolumeX');
      }
    } catch (e) { push('Audio unavailable', 'X'); }
  };
  return (
    <button onClick={toggle}
      className={`fixed left-5 bottom-5 z-40 flex h-12 w-12 items-center justify-center rounded-2xl transition-all hover:scale-110 border shadow-[0_10px_30px_rgba(0,0,0,0.6)] ${on ? 'text-white border-[color:var(--accent-1)]' : 'text-white/70 border-white/[0.1]'}`}
      style={on ? { background: 'linear-gradient(135deg, var(--accent-2), var(--accent-4))' } : { background: 'rgba(255,255,255,0.05)' }}
      aria-label="Ambient sound">
      {on ? <H.Volume2 size={20} /> : <H.VolumeX size={20} />}
    </button>
  );
}

function App() {
  const [loading, setLoading] = useState(true);
  const [activeProject, setActiveProject] = useState(null);
  const [accent, setAccent] = useState('purple');
  const [paletteOpen, setPaletteOpen] = useState(false);
  const [activeSection, setActiveSection] = useState('home');

  useEffect(() => { document.documentElement.setAttribute('data-accent', accent); }, [accent]);

  useEffect(() => {
    const onKey = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setPaletteOpen((v) => !v); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  useEffect(() => {
    if (loading) return;
    const sections = portfolio.nav.map((n) => document.querySelector(n.href)).filter(Boolean);
    const io = new IntersectionObserver((entries) => entries.forEach((e) => { if (e.isIntersecting) setActiveSection(e.target.id); }), { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
    sections.forEach((s) => io.observe(s));
    return () => io.disconnect();
  }, [loading]);

  if (loading) return <Preloader onDone={() => setLoading(false)} />;

  return (
    <AchievementsProvider>
      <ToastProvider>
        <div className="relative min-h-screen bg-black text-white overflow-x-hidden">
          <AnimatedBackground />
          <CustomCursor />
          <RippleEffect />
          <ScrollProgress />
          <Navbar onOpenPalette={() => setPaletteOpen(true)} />
          <SectionIndicator active={activeSection} />
          <main className="relative z-[2]">
            <Hero />
            <HeroStats />
            <TechMarquee />
            <About />
            <Focus />
            <Skills />
            <Projects onOpen={setActiveProject} />
            <Experience />
            <Certifications />
            <Testimonials />
            <GithubSection />
            <LinkedInSection />
            <Contact />
          </main>
          <Footer />
          <AccentSwitcher accent={accent} setAccent={setAccent} />
          <Chatbot />
          <MusicToggle />
          <BackToTop />
          <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} />
          <AnimatePresenceC>
            {activeProject && (<ProjectModal project={activeProject} onClose={() => setActiveProject(null)} />)}
          </AnimatePresenceC>
        </div>
      </ToastProvider>
    </AchievementsProvider>
  );
}

/* Load projects / skills / experience / certifications from the PostgreSQL-backed API.
   If the API is unreachable the built-in defaults above are used, so the site never breaks. */
async function loadPortfolioFromApi() {
  try {
    const res = await fetch('/api/portfolio');
    if (!res.ok) return;
    const d = await res.json();
    if (d.projects && d.projects.length) {
      portfolio.projects.items = d.projects.map((p) => ({ ...p, links: p.links || {} }));
      const tags = new Set();
      d.projects.forEach((p) => (p.filterTags || []).forEach((t) => tags.add(t)));
      portfolio.projects.filters = ['All', ...tags];
    }
    if (d.skillCategories && d.skillCategories.length) portfolio.skills.categories = d.skillCategories;
    if (d.experiences && d.experiences.length) portfolio.experience.items = d.experiences;
    if (d.certifications && d.certifications.length) portfolio.certifications.items = d.certifications;
  } catch (e) { console.warn('API unavailable, using built-in content.', e); }
}
loadPortfolioFromApi().finally(() => {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script>
